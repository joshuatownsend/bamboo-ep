[package]
name = "bamboo-ep-desktop"
version = "0.1.0"
description = "Download your BambooHR training records and certificates"
authors = ["bamboo-ep"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "bamboo_ep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The AI provider call is made here rather than through tauri-plugin-http.
# That plugin's allow-list is pinned to BambooHR in capabilities/default.json
# and cannot express a base URL the user types in at runtime. Owning the
# request here also means the provider API key is read straight from the
# credential store into the request and never crosses into the webview.
# `multipart` is for the Essential Personnel certificate upload: EP takes the
# file in its own request and the record cites the URL it returns.
reqwest = { version = "0.12", features = ["json", "multipart"] }

# The OS credential store: Windows Credential Manager, macOS Keychain, and
# the Secret Service on Linux. Chosen over tauri-plugin-stronghold because
# Stronghold needs a vault password, which would mean asking every employee
# to invent and remember a second secret just to store their API key.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
