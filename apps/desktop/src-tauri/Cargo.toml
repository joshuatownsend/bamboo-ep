[package]
name = "bamboo-ep-desktop"
version = "0.1.0"
description = "Download your BambooHR training records and certificates"
authors = ["bamboo-ep"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "bamboo_ep_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The OS credential store: Windows Credential Manager, macOS Keychain, and
# the Secret Service on Linux. Chosen over tauri-plugin-stronghold because
# Stronghold needs a vault password, which would mean asking every employee
# to invent and remember a second secret just to store their API key.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
